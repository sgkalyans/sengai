<!doctype html>
<html lang="en" data-locale="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://tally.so; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tally.so; frame-src https://tally.so; connect-src 'self' https://tally.so; form-action 'self' https://tally.so; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>செங்கை · Sengai — A Caring Hand (prototype)</title>
<meta name="description" content="Arrange meals that taste just like home for your parents and loved ones in Tamil Nadu, from wherever you live.">
<script src="theme-init.js"></script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6eee1; --bg-2:#fbf7f0; --husk:#ebddc6; --husk-soft:#f1e6d4;
  --accent:#9a3b22; --accent-deep:#6e2915; --accent-soft:#e8c9b8; --brass:#b7862c;
  --ink:#2b2420; --ink-soft:#5c514a; --line:rgba(43,36,32,.12); --line-strong:rgba(43,36,32,.22);
  --on-accent:#fbf7f0; --ask-bg:#6e2915; --ask-ink:#f6eee1; --bubble:#fbf7f0; --bubble-ink:#6e2915;
  --footer-bg:#2b2420; --footer-ink:#f6eee1; --brand-teal:#07706a; --tag-bg:#fde2e0; --tag-ink:#c8102e;
  --sans:"Hanken Grotesk","Noto Sans Tamil",ui-sans-serif,system-ui,sans-serif;
  --tamil:"Noto Sans Tamil","Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --tamil-serif:"Noto Serif Tamil","Noto Sans Tamil",Georgia,serif;
  --r:1.25rem;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1d1815; --bg-2:#241e1a; --husk:#2f2620; --husk-soft:#29211c;
  --accent:#d0694a; --accent-deep:#b4512f; --accent-soft:#5a2d1f; --brass:#d1a14a;
  --ink:#f1e7d8; --ink-soft:#c1b2a1; --line:rgba(241,231,216,.12); --line-strong:rgba(241,231,216,.24);
  --on-accent:#1d1815; --ask-bg:#3a170c; --ask-ink:#f1e7d8; --bubble:#f6eee1; --bubble-ink:#6e2915;
  --footer-bg:#141110; --footer-ink:#f1e7d8; --brand-teal:#6fc3b8; --tag-bg:#4a1c1c; --tag-ink:#ff9a8f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(5rem + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="ta"] body{font-family:var(--tamil);line-height:1.8}
h1,h2,h3,p,ul,ol,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:72rem;margin-inline:auto;padding-inline:1.25rem}
@media(min-width:768px){.wrap{padding-inline:2rem}}
.sec{padding-block:5rem}
@media(min-width:768px){.sec{padding-block:7rem}}
.ta-display{font-family:var(--tamil-serif);font-weight:700}
.muted{color:var(--ink-soft)}
.lead{font-size:1.125rem;color:var(--ink-soft)}
.measure{max-width:38rem}
.h2{font-size:clamp(1.9rem,5.5vw,3rem);font-weight:700;letter-spacing:-.015em;line-height:1.15}
html[lang="ta"] .h2{font-size:clamp(1.6rem,4.6vw,2.5rem);line-height:1.4;letter-spacing:0}
.grid2{display:grid;gap:3rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:0 1.5rem;border-radius:999px;font-weight:600;font-size:.975rem;border:1px solid transparent;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s;text-align:center;line-height:1.3}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-secondary{border-color:var(--line-strong);background:transparent}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-light{background:#fbf7f0;color:#6e2915}
.btn-text{background:none;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:4px;padding:0;min-height:0}
.btn[disabled]{opacity:.6;cursor:progress}

/* nav */
.skip{position:absolute;left:1rem;top:-4rem;z-index:70;background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:999px}
.skip:focus{top:calc(1rem + env(safe-area-inset-top,0px))}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);transition:box-shadow .3s}
header.nav.scrolled{box-shadow:0 1px 0 var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:4rem}
@media(min-width:768px){.nav-in{height:5rem}}
.logo{display:inline-flex;align-items:center;gap:.6rem}
.mark{display:block;flex-shrink:0}
.logo .mark{width:2.5rem;height:2.5rem}
:root[data-theme="dark"] .logo .mark,:root[data-theme="dark"] .form-intro .mark{padding:.2rem;background:#fbf7f0;border-radius:999px;box-sizing:content-box}
.logo .name{font-family:var(--sans);font-weight:700;color:var(--brand-teal);font-size:1.6rem;line-height:1.05;display:block;width:max-content}
.logo .en{display:block;width:max-content;font-size:.65rem;color:var(--tag-ink);background:var(--tag-bg);padding:.2em .55em;border-radius:999px;font-weight:600;letter-spacing:.01em;line-height:1.2;margin-top:.2rem;font-family:var(--sans);white-space:nowrap}
.nav-links{display:none;gap:1.75rem;font-size:.95rem;color:var(--ink-soft)}
.nav-links a:hover{color:var(--accent)}
@media(min-width:1024px){.nav-links{display:flex}}
.nav-right{display:flex;align-items:center;gap:.5rem}
.nav-cta{display:none}
@media(min-width:768px){.nav-cta{display:inline-flex;min-height:2.75rem}.nav-right{gap:.75rem}}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;font-size:.875rem}
.lang button{border:0;background:none;min-height:2.25rem;padding:0 .8rem;border-radius:999px;cursor:pointer;color:var(--ink-soft);font-weight:500}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border:1px solid var(--line-strong);background:none;cursor:pointer;border-radius:999px;color:var(--ink);flex-shrink:0}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn svg{width:1.15rem;height:1.15rem}
.theme-row{display:flex;align-items:center;gap:.75rem;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:1rem 0;font-size:1.25rem;font-weight:500;color:var(--ink);cursor:pointer;text-align:left}
.theme-row svg{width:1.4rem;height:1.4rem}
@media(max-width:479px){.nav-in{gap:.5rem}.nav-right{gap:.25rem}.nav-right .theme-btn{display:none}.lang button{padding:0 .6rem}}
@media(min-width:480px){.theme-row{display:none}}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border:0;background:none;cursor:pointer;border-radius:999px}
@media(min-width:1024px){.menu-btn{display:none}}
.mobile-menu{position:fixed;inset:0;z-index:35;background:var(--bg);padding-top:calc(5.5rem + env(safe-area-inset-top,0px));overflow:auto}
.mobile-menu[hidden]{display:none}
.mobile-menu a.item{display:block;border-bottom:1px solid var(--line);padding:1rem 0;font-size:1.5rem;font-weight:500}

/* hero */
.hero{padding:1.5rem 0 4rem}
@media(min-width:768px){.hero{padding-top:2.5rem}}
.hero-grid{display:grid;gap:2.5rem;align-items:center}
@media(min-width:1024px){.hero-grid{grid-template-columns:1.35fr .65fr;gap:4rem}.hero{padding-bottom:6rem}}
.kicker{color:var(--accent);font-weight:500;font-size:.95rem}
.hero h1{font-family:var(--tamil-serif);font-weight:700;font-size:clamp(1.85rem,6.4vw,3.1rem);line-height:1.35;margin-top:1rem}
.hero h1 span{display:block}
.subline{margin-top:1.25rem;font-size:clamp(1.25rem,3vw,1.5rem);font-weight:600;line-height:1.35}
.hero .lead{margin-top:1rem}
.cta-row{display:flex;flex-direction:column;gap:.75rem;margin-top:2rem}
@media(min-width:640px){.cta-row{flex-direction:row}}
.serving{display:flex;align-items:center;gap:.5rem;margin-top:1.5rem;font-size:.875rem;color:var(--ink-soft)}
.serving svg{width:1rem;height:1rem;color:var(--accent);flex-shrink:0}
.arch{aspect-ratio:4/5;width:100%;max-width:28rem;margin-inline:auto;border-radius:999px 999px var(--r) var(--r)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}

/* photo placeholder */
.photo{position:relative;overflow:hidden;background:#ebddc6}
.photo svg.scene{position:absolute;inset:0;width:100%;height:100%}
.photo .tag{position:absolute;left:.75rem;bottom:.75rem;background:rgba(251,247,240,.88);color:#5c514a;font-size:.7rem;font-weight:500;padding:.25rem .6rem;border-radius:999px;font-family:var(--sans)}

/* ask */
.ask{background:var(--ask-bg);color:var(--ask-ink)}
.ask-grid{display:grid;gap:3rem;align-items:center}
@media(min-width:1024px){.ask-grid{grid-template-columns:1.1fr .9fr;gap:5rem}}
.bubble{background:var(--bubble);color:#2b2420;border-radius:1.75rem 1.75rem .4rem 1.75rem;padding:1.5rem;box-shadow:0 24px 48px -24px rgba(0,0,0,.45);max-width:36rem}
@media(min-width:640px){.bubble{padding:1.75rem 2rem}}
.bubble h2{font-family:var(--tamil-serif);font-weight:700;color:var(--bubble-ink);font-size:clamp(1.6rem,6vw,3rem);line-height:1.4}
.bubble .tr{margin-top:.5rem;color:#5c514a;font-style:italic}
.sent{display:flex;justify-content:flex-end;align-items:center;gap:.35rem;margin-top:.75rem;padding-right:.5rem;font-size:.875rem;opacity:.65;max-width:36rem}
.ask-copy{max-width:28rem;font-size:1.125rem;opacity:.9}
.ask-copy p+p{margin-top:1rem}
.ask-copy .hl{margin-top:2.5rem;border-left:2px solid var(--brass);padding-left:1.25rem;font-size:clamp(1.4rem,3.5vw,1.7rem);font-weight:600;line-height:1.35;opacity:1}
.ask-copy .hl span{display:block}

/* distance */
.dist-title{font-size:clamp(2.3rem,7vw,3.75rem);font-weight:700;letter-spacing:-.02em;line-height:1.1}
html[lang="ta"] .dist-title{font-size:clamp(2rem,6vw,3.2rem);line-height:1.35;letter-spacing:0}
.dist-title span{display:block}
.dist-title span:first-child{color:var(--ink-soft)}
@media(min-width:1024px){.grid2{grid-template-columns:1fr 1fr;gap:4rem}}
.flow{display:flex;flex-direction:column;margin-top:3.5rem}
@media(min-width:768px){.flow{flex-direction:row;align-items:flex-start;margin-top:5rem}}
.node{display:flex;align-items:center;gap:1.25rem;flex:1}
@media(min-width:768px){.node{flex-direction:column;text-align:center}}
.circle{width:4rem;height:4rem;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.5rem}
.circle.far{border:1px dashed var(--line-strong)}
.circle.sengai{background:#fff;border:1px solid var(--line)}
.circle.sengai .mark{width:2.75rem;height:2.75rem}
.circle.home{background:var(--husk);color:var(--accent-deep)}
.circle.home svg{width:1.75rem;height:1.75rem}
.node .l{display:block;font-size:1.25rem;font-weight:600}
.node .p{display:block;color:var(--accent);font-weight:500}
.node .n{display:block;font-size:.875rem;color:var(--ink-soft);margin-top:.1rem}
.thread{display:flex;padding-left:31px}
.thread span{display:block;height:2.5rem;border-left:2px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
@media(min-width:768px){.thread{flex:.7;padding:2rem 0 0}.thread span{height:0;width:100%;border-left:0;border-top:2px dashed color-mix(in srgb,var(--accent) 45%,transparent)}}
@keyframes city{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.city{display:inline-block;animation:city .5s cubic-bezier(.22,1,.36,1) both}

/* services */
.services{background:var(--bg-2)}
.svc-grid{display:grid;gap:2.5rem;margin-top:3rem}
@media(min-width:1024px){.svc-grid{grid-template-columns:1.05fr 1fr;gap:4rem}}
.feature{border-radius:var(--r);overflow:hidden;background:var(--husk-soft)}
.feature .photo{aspect-ratio:4/3}
.feature .body{padding:1.5rem}
@media(min-width:640px){.feature .body{padding:2rem}}
.ic-title{display:flex;align-items:center;gap:.75rem;color:var(--accent)}
.ic-title h3{font-size:1.5rem;font-weight:600;color:var(--ink);line-height:1.3}
.ic{width:1.5rem;height:1.5rem;flex-shrink:0}
.svc-list{align-self:center}
.svc-list li{display:flex;gap:1.25rem;padding:1.75rem 0;border-top:1px solid var(--line)}
.svc-list li:first-child{border-top:0;padding-top:0}
.svc-list li:last-child{padding-bottom:0}
.dot-ic{width:3rem;height:3rem;border-radius:999px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--accent);flex-shrink:0;margin-top:.2rem}
.svc-list h3{font-size:1.25rem;font-weight:600;line-height:1.35}
.soon{margin-top:4rem;border:1px dashed var(--line-strong);border-radius:var(--r);padding:1.5rem}
@media(min-width:640px){.soon{padding:2rem}}
.soon-head{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.soon-head h3{font-size:1.25rem;font-weight:600}
.badge{background:var(--husk);color:var(--ink-soft);font-size:.8rem;font-weight:500;padding:.15rem .65rem;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem}
.chips li{border:1px dashed var(--line-strong);border-radius:999px;padding:.45rem 1rem;font-size:.95rem;color:var(--ink-soft)}

/* how */
.steps{display:grid;gap:2.5rem;margin-top:3rem}
@media(min-width:768px){.steps{grid-template-columns:repeat(3,1fr);gap:2rem}}
.steps li{position:relative;border-top:2px solid color-mix(in srgb,var(--accent) 25%,transparent);padding-top:1.5rem}
.steps li::before{content:"";position:absolute;top:-2px;left:0;width:3rem;height:2px;background:var(--accent)}
.steps .num{font-size:3rem;font-weight:700;color:color-mix(in srgb,var(--accent) 32%,transparent);line-height:1;font-variant-numeric:tabular-nums;font-family:var(--sans)}
.steps h3{margin-top:.9rem;font-size:1.25rem;font-weight:600;line-height:1.35}
.steps p{margin-top:.5rem;color:var(--ink-soft)}
.closing{margin-top:3.5rem;display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem;background:var(--husk-soft);border-radius:var(--r);padding:1.5rem}
@media(min-width:640px){.closing{flex-direction:row;align-items:center;justify-content:space-between;padding:2rem}}
.closing p{font-size:clamp(1.2rem,3vw,1.5rem);font-weight:600;line-height:1.35}
.closing .btn{flex-shrink:0}

/* nri */
.nri{background:var(--husk-soft)}
.nri-grid{display:grid;gap:3rem;align-items:center}
@media(min-width:1024px){.nri-grid{grid-template-columns:.85fr 1.15fr;gap:5rem}}
.nri-photo{aspect-ratio:4/5;width:100%;max-width:28rem;justify-self:center;border-radius:var(--r);order:2}
@media(min-width:1024px){.nri-photo{order:0}}
.flags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2rem}
.flags li{display:inline-flex;gap:.5rem;align-items:center;background:var(--bg-2);border-radius:999px;padding:.35rem .9rem;font-size:.95rem}
.checks{margin-top:2rem;display:grid;gap:.75rem}
.checks li{display:flex;gap:.75rem}
.checks svg{width:1.25rem;height:1.25rem;color:var(--accent);flex-shrink:0;margin-top:.25rem}

/* trust */
.trust-grid{display:grid;gap:3rem}
@media(min-width:1024px){.trust-grid{grid-template-columns:.8fr 1.2fr;gap:5rem}}
.trust-list{display:grid;gap:2rem 2.5rem}
@media(min-width:640px){.trust-list{grid-template-columns:1fr 1fr}}
.trust-list li{display:flex;gap:1rem}
.trust-list svg{color:var(--accent);margin-top:.15rem}
.trust-list h3{font-size:1rem;font-weight:600}
.trust-list p{margin-top:.25rem;color:var(--ink-soft)}

/* stories */
.stories{background:var(--bg-2)}
.story-grid{list-style:none;padding:0;margin:2.5rem 0 0;display:grid;gap:1.25rem}
@media(min-width:768px){.story-grid{grid-template-columns:1fr 1fr}}
.story{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem}
.story-place{display:inline-flex;align-items:center;gap:.35rem;font-size:.875rem;font-weight:600;color:var(--accent)}
.story-place svg{width:1rem;height:1rem}
.story p{margin-top:.75rem;font-size:1.125rem;line-height:1.55}
html[lang="ta"] .story p{line-height:1.75}

/* about */
.path{position:relative;align-self:center;border-left:2px dashed var(--line-strong);padding-left:2rem;margin-left:.5rem}
.path li{position:relative;padding-bottom:2.25rem}
.path li:last-child{padding-bottom:0}
.path li::before{content:"";position:absolute;top:.45rem;left:-2.6rem;width:1rem;height:1rem;border-radius:999px;border:2px solid var(--line-strong);background:var(--bg)}
.path li.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.path .note{display:block;font-size:.875rem;font-weight:500;color:var(--ink-soft)}
.path .now .note{color:var(--accent)}
.path .lbl{display:block;font-size:1.5rem;font-weight:600;color:color-mix(in srgb,var(--ink) 55%,transparent);line-height:1.35}
.path .now .lbl{color:var(--ink)}

/* final */
.final{padding-inline:.75rem}
@media(min-width:640px){.final{padding-inline:1.25rem}}
.final-in{max-width:80rem;margin:0 auto;border-radius:2rem;background:#9a3b22;color:#fbf7f0;text-align:center;padding:5rem 1.25rem}
@media(min-width:768px){.final-in{padding:7rem 2rem}}
.final h2{max-width:48rem;margin:0 auto;font-size:clamp(1.9rem,5.5vw,3rem);font-weight:700;line-height:1.2;letter-spacing:-.015em}
html[lang="ta"] .final h2{font-size:clamp(1.6rem,4.6vw,2.5rem);line-height:1.45;letter-spacing:0}
.final h2 span{display:block}
.final h2 span:first-child{opacity:.75}
.final p{max-width:36rem;margin:1.5rem auto 0;font-size:1.125rem;opacity:.88}
.final .cta-row{justify-content:center;align-items:center;margin-top:2.5rem}

/* form */
.form-grid{display:grid;gap:2.5rem;max-width:48rem}
.form-intro{text-align:center}
.form-intro .mark{width:3.5rem;height:3.5rem;margin:0 auto}
.form-intro h2{margin-top:1.25rem}
/* Tally renders dark text we cannot restyle, so the form card stays light in both themes. */
.tally-wrap{background:#fbf7f0;color-scheme:light;border-radius:var(--r);padding:1.25rem;min-width:0}
@media(min-width:640px){.tally-wrap{padding:1.75rem}}
.tally-wrap iframe{display:block;width:100%;min-height:22rem;border:0}
.small{font-size:.875rem;color:var(--ink-soft)}

/* footer */
footer{background:var(--footer-bg);color:var(--footer-ink);padding:4rem 0 7rem}
@media(min-width:768px){footer{padding:5rem 0 3rem}}
.foot-grid{display:grid;gap:3rem}
@media(min-width:768px){.foot-grid{grid-template-columns:1.3fr 1fr}}
footer .logo .mark{width:3.5rem;height:3.5rem;padding:.35rem;background:#fbf7f0;border-radius:999px;box-sizing:content-box}
footer .logo .name{color:var(--footer-ink);font-size:2.1rem}
footer .logo .en{color:#ff9a8f;background:#4a1c1c;font-size:.85rem}
